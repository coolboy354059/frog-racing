<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142b26"><title>Frog Racing</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142b26;color:#fcf9e7;font:600 16px system-ui,sans-serif}canvas{display:block;width:100%;height:100dvh}button,select{font:inherit;cursor:pointer}button{border:0;border-radius:9px;padding:.75rem 1rem;background:#f1facb;color:#193229;font-weight:850}button:focus-visible,select:focus-visible{outline:4px solid #ffb837}#panel{position:absolute;top:50%;left:5%;transform:translateY(-50%);background:#102e29f5;border:1px solid #769185;border-radius:18px;padding:clamp(16px,3vw,38px);width:min(365px,90vw);box-shadow:0 16px 55px #132d313d}h1{font:italic 950 clamp(38px,5vw,70px)/.92 system-ui;margin:0 0 22px;letter-spacing:-.07em;text-transform:uppercase}h1 span{color:#d2fa68}label{display:block;font-size:.76rem;text-transform:uppercase;letter-spacing:.13em;margin-top:14px}select{width:100%;background:#22413b;color:white;border:1px solid #658079;border-radius:8px;padding:9px;margin:5px 0}#start{background:#d2fa68;width:100%;margin-top:15px}small{display:block;color:#c2d4c8;line-height:1.5}#hud{position:absolute;top:14px;left:3%;right:3%;display:flex;gap:10px;align-items:center;flex-wrap:wrap}#stats,#pause,#msg{background:#102e29ed;color:white;border-radius:9px;padding:10px 14px}#pause{margin-left:auto}#msg{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:clamp(24px,6vw,64px);text-align:center}#touch{position:absolute;bottom:12px;left:3%;right:3%;display:flex;gap:8px;touch-action:none}#touch button{user-select:none;touch-action:none}#touch button:nth-child(3){margin-left:auto}#result{color:#d2fa68;font-size:1.1rem}#back{margin-top:8px}[hidden]{display:none!important}@media(pointer:fine){#touch{display:none}}@media(max-height:510px){#panel{max-height:96dvh;overflow:auto}h1{font-size:36px;margin-bottom:8px}}
#panel{max-height:96dvh;overflow:auto}#online{margin-top:10px;background:#30534b;color:#fff;width:100%}#room button{margin:5px 3px 4px 0}#room input{width:100%;font:700 18px monospace;letter-spacing:.15em;text-transform:uppercase;padding:9px;border:1px solid #658079;border-radius:6px}#roomcode{color:#d2fa68;font:900 28px monospace;letter-spacing:.12em}#roomInfo{line-height:1.4}#back{margin-bottom:7px}#setup a{color:#d2fa68}#balance{margin:8px 0}#buy{margin-bottom:6px}button:disabled{opacity:.65;cursor:default}</style><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"54a03ac0838849f48eea90b7916fb29a"}'></script></head><body><canvas id="world" aria-label="3D frog cart race"></canvas>
<section id="panel"><h1>Frog<br><span>Racing</span></h1><p id="result" role="status"></p><div id="setup"><label for="cart">Your cart</label><select id="cart"></select><small id="spec"></small><p id="balance" aria-live="polite"></p><button id="buy" hidden></button><small>Earn coins here or in <a href="/frog-jumper-2d/">Frog Jumper 2D</a>.</small><label for="track">Circuit</label><select id="track"></select><small>3 laps · 9 racers</small></div><button id="start">Start race →</button><button id="online">Race with friends</button><section id="room" hidden><h2>Race with friends</h2><div id="entry"><button id="create">Create room</button><label for="code">Friend’s room code</label><input id="code" maxlength="6" autocomplete="off" spellcheck="false" placeholder="ABC234"><button id="join">Join room</button><div id="challenge"></div></div><strong id="roomcode"></strong><p id="roomInfo" role="status"></p><button id="launch" hidden>Start multiplayer race</button></section><button id="back" hidden>Back to garage</button><p><small>↑ or W to accelerate · ← → or A D to steer · ↓ or S to brake · P to pause. Drive through gold coins to collect them. Yellow pads give you a boost!</small></p></section>
<div id="hud" hidden><strong id="stats"></strong><button id="pause">Pause</button></div><strong id="msg" hidden></strong><div id="touch" hidden><button data-key="arrowleft" aria-label="Steer left">◀</button><button data-key="arrowright" aria-label="Steer right">▶</button><button data-key="arrowdown">Brake</button><button data-key="arrowup">Gas</button></div>
<script type="module" src="race.js?v=garage-2"></script></body></html>
